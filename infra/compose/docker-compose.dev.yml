# Local development only: PostgreSQL for running the web app and worker on a laptop. Video bytes go
# in a plain directory (MEDIA_DIR in apps/web/.env), like production (ADR-0006, amended).
#   docker compose -f infra/compose/docker-compose.dev.yml up -d
# Never deployed. Credentials below are throwaway local defaults.
name: rowlens-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rowlens
      POSTGRES_USER: rowlens_owner
      POSTGRES_PASSWORD: rowlens_dev_only
    ports: ['127.0.0.1:5433:5432']
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rowlens_owner -d rowlens']
      interval: 5s
      retries: 10

volumes:
  db_data:
