# Production stack for /opt/rowlens on trustable-prod (ADR-0002). Installed on the server as
# /opt/rowlens/docker-compose.yml by infra/deploy/install.sh (approval required) and run only through
# /opt/rowlens/bin/rowlens-deploy, which sets ROWLENS_TAG:
#
#   ssh trustable-prod /opt/rowlens/bin/rowlens-deploy status
#
# Video bytes live in /opt/rowlens/media (ADR-0006), owned by deploy (uid 1000) = the images' `node`
# and `worker` users, so the bind mounts need no ownership change.
#
# Database roles (ADR-0005): `migrate` connects as the owner, `web` as rowlens_app (no BYPASSRLS).
# Both passwords come from /opt/rowlens/.env, which Compose also reads for the variables below.
name: rowlens

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

services:
  web:
    <<: *defaults
    image: ghcr.io/ewoutbarendregt/rowlens-web:${ROWLENS_TAG:?set ROWLENS_TAG}
    env_file: /opt/rowlens/.env
    environment:
      DATABASE_URL: postgres://rowlens_app:${ROWLENS_APP_DB_PASSWORD:?ROWLENS_APP_DB_PASSWORD is required}@db:5432/rowlens
      MEDIA_DIR: /media
    volumes:
      # Overridable only for the deploy rehearsal, which runs this file on a laptop.
      - ${ROWLENS_MEDIA_DIR:-/opt/rowlens/media}:/media
    networks:
      internal: {}
      # Shared with trustable's Caddy, which routes /projects/rowlens/* here (trustable.nl#377).
      trustable_proxy:
        aliases: [rowlens-web]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  # Probes and transcodes uploads (#47, ADR-0008). Shares the CPU with trustable.nl and AudioScribe:
  # capped at 2 of 4 vCPUs, ffmpeg at nice 10 with 2 threads. Same database role as web.
  worker:
    <<: *defaults
    image: ghcr.io/ewoutbarendregt/rowlens-worker:${ROWLENS_TAG:?set ROWLENS_TAG}
    environment:
      DATABASE_URL: postgres://rowlens_app:${ROWLENS_APP_DB_PASSWORD:?ROWLENS_APP_DB_PASSWORD is required}@db:5432/rowlens
      MEDIA_DIR: /media
      FFMPEG_THREADS: '2'
    volumes:
      - ${ROWLENS_MEDIA_DIR:-/opt/rowlens/media}:/media
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    # A transcode in progress is put back in the queue on SIGTERM; give it time to say so.
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }

  # Run by rowlens-deploy before `up` (`compose --profile migrate run --rm migrate`), never kept running.
  migrate:
    image: ghcr.io/ewoutbarendregt/rowlens-web:${ROWLENS_TAG:?set ROWLENS_TAG}
    profiles: [migrate]
    command: ['node', 'dist/server/db/migrate-cli.js']
    environment:
      DATABASE_OWNER_URL: postgres://rowlens_owner:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/rowlens
      ROWLENS_APP_DB_PASSWORD: ${ROWLENS_APP_DB_PASSWORD:?ROWLENS_APP_DB_PASSWORD is required}
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }

  db:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rowlens
      POSTGRES_USER: rowlens_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [db_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rowlens_owner -d rowlens']
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

networks:
  internal:
    internal: true
  trustable_proxy:
    external: true

volumes:
  db_data:
