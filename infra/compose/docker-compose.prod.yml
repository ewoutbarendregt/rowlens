# Production stack for /opt/rowlens on trustable-prod (ADR-0002). Installed on the server as
# /opt/rowlens/docker-compose.yml by infra/deploy/install.sh (approval required) and run only through
# /opt/rowlens/bin/rowlens-deploy, which sets ROWLENS_TAG:
#
#   ssh trustable-prod /opt/rowlens/bin/rowlens-deploy status
#
# Worker (#33) and MinIO media storage (#32) are added with their stories.
name: rowlens

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '5' }

services:
  web:
    <<: *defaults
    image: ghcr.io/ewoutbarendregt/rowlens-web:${ROWLENS_TAG:?set ROWLENS_TAG}
    env_file: /opt/rowlens/.env
    networks:
      internal: {}
      # Shared with trustable's Caddy, which routes /projects/rowlens/* here (trustable.nl#377).
      trustable_proxy:
        aliases: [rowlens-web]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  db:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rowlens
      POSTGRES_USER: rowlens_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [db_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rowlens_owner -d rowlens']
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

networks:
  internal:
    internal: true
  trustable_proxy:
    external: true

volumes:
  db_data:
