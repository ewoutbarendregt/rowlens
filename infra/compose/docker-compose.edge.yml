# Local "edge" stack: RowLens behind a Caddy that mirrors trustable.nl's production routing.
# Lets you test the Caddy route proposed in #24 and the app's base-path handling before deploying.
#
#   pnpm edge:up      # build rowlens-web and start; open http://localhost:8080/projects/rowlens/
#   pnpm e2e:edge     # Playwright checks through Caddy
#   pnpm edge:down
#
# Never deployed. Networks mirror ADR-0002: only rowlens-web shares the proxy network with Caddy.
name: rowlens-edge

services:
  caddy:
    image: caddy:2-alpine
    ports: ['127.0.0.1:${EDGE_PORT:-8080}:80']
    volumes:
      - ../caddy/edge.Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/rowlens.caddy:/etc/caddy/rowlens.caddy:ro
    networks: [proxy]
    depends_on:
      rowlens-web: { condition: service_healthy }
      audioscribe: { condition: service_started }
      web: { condition: service_started }

  rowlens-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: rowlens-web:edge
    environment:
      PUBLIC_ORIGIN: http://localhost:${EDGE_PORT:-8080}
      APP_VERSION: edge
      DATABASE_URL: postgres://rowlens_app:edge_app_password_only@db:5432/rowlens
    networks:
      proxy:
        aliases: [rowlens-web]
      internal: {}
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Same image and command as the production `migrate` service.
  migrate:
    image: rowlens-web:edge
    command: ['node', 'dist/server/db/migrate-cli.js']
    environment:
      DATABASE_OWNER_URL: postgres://rowlens_owner:edge_owner_only@db:5432/rowlens
      ROWLENS_APP_DB_PASSWORD: edge_app_password_only
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rowlens
      POSTGRES_USER: rowlens_owner
      POSTGRES_PASSWORD: edge_owner_only
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rowlens_owner -d rowlens']
      interval: 2s
      retries: 20

  # Stand-ins for the apps that share the production Caddy.
  audioscribe:
    image: caddy:2-alpine
    environment: { STANDIN_NAME: audioscribe }
    volumes: ['../caddy/standin.Caddyfile:/etc/caddy/Caddyfile:ro']
    networks: [proxy]

  web:
    image: caddy:2-alpine
    environment: { STANDIN_NAME: trustable }
    volumes: ['../caddy/standin.Caddyfile:/etc/caddy/Caddyfile:ro']
    networks: [proxy]

networks:
  proxy: {}
  internal:
    internal: true
