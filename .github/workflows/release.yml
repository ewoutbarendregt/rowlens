name: release

# Conventional Commits on main → release PR with CHANGELOG + semver tag (release-please).
# Deployment is a separate, approval-gated workflow added in M0 (see ADR-0002).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
