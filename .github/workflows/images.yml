name: images

# Every push to main builds rowlens-web and rowlens-worker for linux/amd64 and pushes them to GHCR,
# tagged sha-<7>. Nothing is deployed here: deploying is the manual `deploy` workflow (ADR-0002).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            context: .
          - name: worker
            dockerfile: worker/Dockerfile
            context: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Image tag
        id: tag
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          release=$(node --experimental-strip-types scripts/release-version.js "$GITHUB_RUN_NUMBER")
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push rowlens-${{ matrix.name }}:${{ steps.tag.outputs.tag }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ewoutbarendregt/rowlens-${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          # The player demo is on in production for now (Ewout, 2026-11-01): synthetic clips only, no
          # user data. Remove VITE_FEATURE_PLAYER_DEMO to build without it.
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
            APP_RELEASE=${{ steps.tag.outputs.release }}
            VITE_FEATURE_PLAYER_DEMO=true
            VITE_FEATURE_UNIFIED_USERS=true
            VITE_FEATURE_VIDEO_REUSE=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.release }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Summary
        run: |
          echo "Pushed \`ghcr.io/ewoutbarendregt/rowlens-${{ matrix.name }}:${{ steps.tag.outputs.tag }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Displayed release: **${{ steps.tag.outputs.release }}**." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with **Actions → deploy → Run workflow**, tag \`${{ steps.tag.outputs.tag }}\`." >> "$GITHUB_STEP_SUMMARY"
