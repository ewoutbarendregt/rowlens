name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Conventional Commit PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^(claude/)?(feat|fix|chore|docs|refactor|test|ci|perf)/[a-z0-9][a-z0-9._-]*$ ]] \
            || [[ "$BRANCH" =~ ^(dependabot|release-please)[/-] ]]; then
            echo "ok: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' must match [claude/](feat|fix|chore|docs|refactor|test|ci|perf)/<issue>-<slug>"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Player test fixture (VP9 clip with burned-in frame numbers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          ROWLENS_MEDIA_LOCAL_FFMPEG=1 bash scripts/demo-media/generate.sh --e2e
      - name: Build (with the player demo, for its E2E test)
        run: pnpm build
        env:
          VITE_FEATURE_PLAYER_DEMO: 'true'
      - name: Production bundle contains no demo code
        run: |
          rm -rf apps/web/dist && pnpm build
          if grep -rl "PlayerDemo\|demo-media\|requestVideoFrameCallback" apps/web/dist/client --include=*.js; then
            echo "::error::Feature-flagged demo code leaked into the production bundle"
            exit 1
          fi
          VITE_FEATURE_PLAYER_DEMO=true pnpm build
      - name: Install Playwright browser
        run: pnpm --filter @rowlens/web exec playwright install --with-deps chromium
      - name: E2E smoke + player (desktop + mobile Chromium)
        run: pnpm --filter @rowlens/web e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Dependency audit
        run: pnpm audit --audit-level high

  edge:
    # RowLens behind a Caddy that mirrors trustable.nl, using the exact route proposed in #24.
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @rowlens/web exec playwright install --with-deps chromium
      - name: Test clip for the upload → processing E2E
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
          ROWLENS_MEDIA_LOCAL_FFMPEG=1 bash scripts/demo-media/generate.sh --e2e
      - name: Start edge stack
        run: pnpm edge:up
      - name: E2E through Caddy
        run: pnpm e2e:edge
      - name: Stack logs
        if: failure()
        run: docker compose -f infra/compose/docker-compose.edge.yml logs --no-color
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-edge
          path: apps/web/playwright-report
          retention-days: 7

  deploy-script:
    # The only command the CI key may run on the server: lint, unit tests, and a real rehearsal.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck -x infra/deploy/rowlens-deploy infra/deploy/install.sh infra/deploy/test/*.sh infra/deploy/test/stub/docker
      - name: Unit tests (stubbed docker)
        run: bash infra/deploy/test/run.sh
      - name: Rehearsal against real Docker
        run: bash infra/deploy/test/rehearse.sh

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest
      - name: Dependency audit
        run: uv export --frozen --no-hashes --no-emit-project --format requirements-txt > /tmp/req.txt && uvx pip-audit -r /tmp/req.txt --strict

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR commits
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: [web, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            context: .
          - name: worker
            dockerfile: worker/Dockerfile
            context: worker
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build rowlens-${{ matrix.name }} (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: rowlens-${{ matrix.name }}:ci
          # Same as main's images (images.yml): player demo on.
          build-args: VITE_FEATURE_PLAYER_DEMO=true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke test web image
        if: matrix.name == 'web'
        # Like production: Postgres, the image's migrate command as the owner, web as rowlens_app.
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_DB=rowlens -e POSTGRES_USER=rowlens_owner \
            -e POSTGRES_PASSWORD=smoke_owner_only postgres:16-alpine
          until docker exec db pg_isready -U rowlens_owner -d rowlens -h 127.0.0.1; do sleep 1; done
          docker run --rm --network smoke rowlens-web:ci sh -c 'test -f dist/server/db/migrations/0000_init.sql'
          docker run --rm --network smoke -e ROWLENS_APP_DB_PASSWORD=smoke_app_password_only \
            -e DATABASE_OWNER_URL=postgres://rowlens_owner:smoke_owner_only@db:5432/rowlens \
            rowlens-web:ci node dist/server/db/migrate-cli.js
          docker run -d --name web --network smoke -p 3000:3000 -e PUBLIC_ORIGIN=http://127.0.0.1:3000 \
            -e DATABASE_URL=postgres://rowlens_app:smoke_app_password_only@db:5432/rowlens rowlens-web:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/projects/rowlens/health/ready; then
              curl -fsS -H 'accept: text/html' http://127.0.0.1:3000/projects/rowlens/ | grep -q '<div id="root">'
              curl -fsS http://127.0.0.1:3000/projects/rowlens/demo-media/manifest.json | jq -e 'length > 0'
              exit 0
            fi
            sleep 1
          done
          docker logs web; exit 1
      - name: Smoke test worker image
        if: matrix.name == 'worker'
        run: docker run --rm rowlens-worker:ci sh -c "python -c 'import rowlens_worker.__main__' && ffmpeg -hide_banner -version | head -1"
