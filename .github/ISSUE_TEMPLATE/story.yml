name: Story
description: A user-facing or technical increment with acceptance criteria
labels: ['feature']
body:
  - type: input
    id: epic
    attributes:
      label: Epic
      description: Link the parent epic issue (e.g. #3)
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      placeholder: As a <rower|coach|operator>, I want <capability>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements. These become the tests that define "done".
      placeholder: |
        - [ ] Given … when … then …
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: checkboxes
    id: flags
    attributes:
      label: Checks
      options:
        - label: Touches auth, permissions, tenancy or personal data (needs a security review note in the PR)
        - label: Adds user-facing strings (NL + EN required)
        - label: Unfinished functionality goes behind a feature flag
