[[story]]
epic = "player"
title = "Player accessibility (WCAG 2.1 AA)"
labels = ["feature", "must", "i18n"]
story = "As a user with a disability, I want to operate the player with keyboard and screen reader."
ac = [
  "All controls labelled and keyboard-operable; visible focus; contrast AA",
  "Automated axe check in Playwright passes",
]

[[story]]
epic = "conversation"
title = "Conversation thread per session"
labels = ["feature", "must", "i18n"]
story = "As a rower or coach in the crew, I want to discuss the session in one place."
ac = [
  "Exactly one thread per session; post, reply, edit and delete own messages",
  "Visible only to the crew's rowers and coaches (tenant + crew tests)",
]

[[story]]
epic = "conversation"
title = "Messages linked to a video moment"
labels = ["feature", "must"]
story = "As a coach, I want to point at an exact moment, so that the rower sees what I mean."
ac = [
  "Message optionally anchored to video + timestamp/frame, captured from the player",
  "Clicking the anchor opens the video at that frame, paused",
]

[[story]]
epic = "conversation"
title = "Text annotations at a frame"
labels = ["feature", "must"]
story = "As a coach, I want to leave a note on a specific frame."
ac = [
  "Annotation at frame/time with text; shown as markers on the scrub bar",
  "Visible to the crew; author can edit/delete",
]

[[story]]
epic = "conversation"
title = "Drawing annotations: line, arrow, angle measurement"
labels = ["feature", "must"]
story = "As a coach, I want to draw lines and measure angles on a frame, so that I can show body position."
ac = [
  "Tools: line, arrow, angle (three points, degrees shown); touch and mouse",
  "Coordinates stored normalised to video dimensions; render correctly at any size and in fullscreen",
]

[[story]]
epic = "conversation"
title = "Annotation status: open, resolved, focus point"
labels = ["feature", "must", "i18n"]
story = "As a rower, I want to see which feedback is still open and what my focus points are."
ac = [
  "Status open/resolved/focus point; filter by status",
  "Status changes notify the author",
]

[[story]]
epic = "notifications"
title = "E-mail notifications for new feedback and replies"
labels = ["feature", "must", "i18n"]
story = "As a rower, I want an e-mail when a coach gives me feedback or replies."
ac = [
  "Notify crew members on new messages/annotations in their sessions; batching to avoid spam",
  "Localised; deep link to the moment in the video",
]

[[story]]
epic = "notifications"
title = "Notification preferences and one-click unsubscribe"
labels = ["feature", "must", "i18n"]
story = "As a user, I want to control how often I get e-mails."
ac = [
  "Per-user setting: immediate / daily digest / off",
  "One-click unsubscribe link (List-Unsubscribe header)",
]

[[story]]
epic = "privacy"
title = "Privacy statement NL/EN and processors list"
labels = ["security", "must", "i18n"]
story = "As a user, I want to know what happens with my data and video."
ac = [
  "Privacy statement in NL and EN linked from login and footer",
  "Lists processors from docs/privacy/processors.md, retention, deletion windows and contact",
  "States plainly that videos are not backed up during the pilot (ADR-0006)",
]

[[story]]
epic = "privacy"
title = "Personal data export"
labels = ["security", "must"]
story = "As a user, I want to download my data."
ac = [
  "Export of profile, memberships, messages, annotations and own uploaded videos (links)",
  "Generated as a background job; download link expires; audited",
]

[[story]]
epic = "privacy"
title = "Account deletion"
labels = ["security", "must"]
story = "As a user, I want to delete my account."
ac = [
  "Deletes profile and sessions; own videos deleted or (if coach) transferred per documented rule",
  "Messages anonymised to 'former member'; audited; confirmation e-mail",
]
