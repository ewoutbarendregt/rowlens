# RowLens backlog — source for scripts/github/bootstrap.py.
# Epics for M0–M3; stories with acceptance criteria for M0 and M1. M2/M3 stories are written later.

[[label]]
name = "epic"
color = "3E4B9E"
description = "Group of stories delivering one capability"
[[label]]
name = "feature"
color = "1D76DB"
description = "User-facing or technical increment"
[[label]]
name = "bug"
color = "D73A4A"
description = "Something does not work as it should"
[[label]]
name = "tech-debt"
color = "C5DEF5"
description = "Internal quality work"
[[label]]
name = "analysis"
color = "5319E7"
description = "Video analysis pipeline, metrics, evals"
[[label]]
name = "infra"
color = "0E8A16"
description = "Hosting, CI/CD, storage, monitoring"
[[label]]
name = "security"
color = "B60205"
description = "Auth, permissions, tenancy, privacy — needs a security review note"
[[label]]
name = "i18n"
color = "FBCA04"
description = "Translations and localisation"
[[label]]
name = "must"
color = "000000"
description = "MoSCoW: must have"
[[label]]
name = "should"
color = "555555"
description = "MoSCoW: should have"
[[label]]
name = "could"
color = "AAAAAA"
description = "MoSCoW: could have"
[[label]]
name = "decision-needed"
color = "F9D0C4"
description = "Blocked on a product-owner decision"

[[milestone]]
title = "M0 Foundation"
description = "Repo, CI/CD, base-path deployment of a hello-world, storage decision, auth."
[[milestone]]
title = "M1 MVP"
description = "Clubs/crews, upload, transcoding, player, conversation, annotations, notifications, GDPR basics."
[[milestone]]
title = "M2 Analysis"
description = "Pose, stroke phases, stroke rate, sync, traceability, rower-facing explanations, evals."
[[milestone]]
title = "M3 Growth"
description = "Club self-onboarding, comparisons, trends, more languages."

# ---------------------------------------------------------------- epics

[[epic]]
key = "foundation"
milestone = "M0 Foundation"
title = "Epic: Engineering foundation (repo, CI, conventions)"
labels = ["infra", "must"]
goal = "A monorepo where every PR is linted, type-checked, tested, scanned and built into images, with ADRs, templates, feature flags and an E2E harness."

[[epic]]
key = "hosting"
milestone = "M0 Foundation"
title = "Epic: Hosting & deployment on trustable-prod"
labels = ["infra", "must"]
goal = "RowLens runs as an isolated Compose project at /opt/rowlens, served at https://trustable.nl/projects/rowlens, deployed by a manually triggered pipeline with health check and rollback — without touching trustable.nl or AudioScribe (ADR-0002, ADR-0003)."

[[epic]]
key = "auth"
milestone = "M0 Foundation"
title = "Epic: Authentication (e-mail OTP)"
labels = ["security", "must"]
goal = "Passwordless login by e-mail one-time code with secure sessions, CSRF protection and rate limits (ADR-0011)."

[[epic]]
key = "platform"
milestone = "M0 Foundation"
title = "Epic: Platform services (database, storage, i18n, observability, backups)"
labels = ["infra", "must"]
goal = "The shared building blocks every feature relies on: migrations + RLS helpers, object storage, job queue, NL/EN i18n, logs/metrics/errors, disk alerts, tested backups."

[[epic]]
key = "clubs"
milestone = "M1 MVP"
title = "Epic: Clubs, crews & permissions"
labels = ["security", "must"]
goal = "Clubs as tenants, crews with rowers and coaches, invitation flow, crew-based visibility — with tests proving cross-club access is impossible (ADR-0005)."

[[epic]]
key = "upload"
milestone = "M1 MVP"
title = "Epic: Sessions, upload & transcoding"
labels = ["feature", "must"]
goal = "Coaches create sessions and upload videos from a phone with resumable uploads; videos are transcoded into frame-step-friendly renditions; rowers find their sessions (ADR-0006, ADR-0007)."

[[epic]]
key = "player"
milestone = "M1 MVP"
title = "Epic: Frame-accurate video player"
labels = ["feature", "must"]
goal = "A player that starts within ~2 s on 4G and steps frames instantly: 0.25×/0.5×/1×, ±1 frame, ±0.1 s, loop, fullscreen on iOS Safari and Android Chrome."

[[epic]]
key = "conversation"
milestone = "M1 MVP"
title = "Epic: Conversation & annotations"
labels = ["feature", "must"]
goal = "One thread per session between the crew's rowers and coaches, messages linked to video moments, and annotations (text, line, arrow, angle) with status."

[[epic]]
key = "notifications"
milestone = "M1 MVP"
title = "Epic: E-mail notifications"
labels = ["feature", "must"]
goal = "Rowers and coaches hear about new feedback and replies by e-mail, in their language, with per-user opt-out."

[[epic]]
key = "privacy"
milestone = "M1 MVP"
title = "Epic: Privacy & GDPR basics"
labels = ["security", "must"]
goal = "Privacy statement, documented processors, personal data export, account deletion and an audit log."

[[epic]]
key = "analysis"
milestone = "M2 Analysis"
title = "Epic: Analysis pipeline & traceability"
labels = ["analysis", "should"]
goal = "Pose estimation per rower, stroke phases, stroke rate, drive:recovery ratio, rhythm, crew sync and joint angles — each value traceable to frames, keypoints, model and pipeline versions, or refused with a reason (ADR-0009). Includes seat assignment confirmation and the reference-model comparison."

[[epic]]
key = "explanations"
milestone = "M2 Analysis"
title = "Epic: Rower-facing explanations & drills"
labels = ["analysis", "should"]
goal = "Plain-language feedback and drill suggestions generated from structured metrics through a provider-agnostic, versioned-prompt LLM layer, opt-in per club (ADR-0010)."

[[epic]]
key = "evals"
milestone = "M2 Analysis"
title = "Epic: Analysis evaluation suite"
labels = ["analysis", "should"]
goal = "Hand-labelled reference videos and an automated eval in CI reporting accuracy deltas on pipeline changes."

[[epic]]
key = "onboarding"
milestone = "M3 Growth"
title = "Epic: Club self-onboarding"
labels = ["feature", "could"]
goal = "A new club can sign up, configure itself and invite members without our help; tenant model ready for billing later."

[[epic]]
key = "comparison"
milestone = "M3 Growth"
title = "Epic: Comparison, progress & goals"
labels = ["feature", "could"]
goal = "Side-by-side videos synchronised by stroke phase, trends per rower and crew, goals set by coaches."

[[epic]]
key = "reach"
milestone = "M3 Growth"
title = "Epic: More languages, own domain & PWA"
labels = ["feature", "could"]
goal = "Additional languages, an own host/domain (removes the shared-origin risk, ADR-0003), installable PWA with push notifications."

# ---------------------------------------------------------------- M0 stories

[[story]]
epic = "foundation"
title = "Phase 0: repository scaffold, ADRs and CI"
labels = ["infra", "must"]
story = "As the product owner, I want the repository, conventions, architecture proposal and CI in place, so that development can start in small reviewed increments."
ac = [
  "CLAUDE.md, six project MD files, ADRs 0001–0011, issue/PR templates exist",
  "CI runs format, lint, typecheck, tests, build, dependency audit, secret scan and image builds on every PR",
  "Labels, milestones and the M0/M1 backlog exist on GitHub",
  "Phase 0 summary lists findings, decisions needed, risks and first sprint",
]

[[story]]
epic = "foundation"
title = "Repository settings: merge policy without branch protection"
labels = ["infra", "must"]
story = "As the product owner, I want a consistent merge policy, so that main stays deployable even though it isn't technically protected."
ac = [
  "Squash merge only; PR title used as commit message (Conventional Commits); head branches deleted after merge",
  "Actions allowed to open PRs (release-please)",
  "CLAUDE.md states that agents never push, commit or merge to main",
]
notes = "Decided 2026-11-01: private repo on the free plan, so no branch protection rules or environments (they need GitHub Pro). Revisit if more people get write access."

[[story]]
epic = "foundation"
title = "Web app skeleton: Fastify API + React SPA under the base path"
labels = ["feature", "must"]
story = "As a developer, I want the real web app skeleton, so that features have a home that is base-path aware from day one."
ac = [
  "Fastify serves the Vite-built SPA and `/api` under BASE_PATH; SPA fallback for client routes",
  "React Router basename and Vite `base` derived from BASE_PATH; assets load under /projects/rowlens",
  "Health endpoints `/health/live` and `/health/ready` (DB check)",
  "Strict CSP and security headers set by the app",
  "Unit tests + one Playwright test pass with BASE_PATH=/projects/rowlens",
]
notes = "ADR-0003, ADR-0004. Replaces the placeholder server in apps/web/src/server.ts."

[[story]]
epic = "foundation"
title = "Shared contracts package and job schema codegen (TS + Python)"
labels = ["tech-debt", "should"]
story = "As a developer, I want job payloads and API contracts defined once, so that web and worker can't drift apart."
ac = [
  "`packages/contracts` holds JSON Schemas for job types",
  "Generated Zod (TS) and pydantic (Python) types; CI fails if generated code is stale",
]
notes = "ADR-0008."

[[story]]
epic = "foundation"
title = "Feature flag mechanism"
labels = ["feature", "must"]
story = "As the product owner, I want unfinished features hidden behind flags, so that we can prototype safely on production."
ac = [
  "Flags resolved from env defaults, overridable per club in the DB",
  "Server and client helpers; unknown flags default to off",
  "Changing a flag is audited",
]

[[story]]
epic = "foundation"
title = "E2E harness: Playwright behind Caddy with base path, mobile + desktop"
labels = ["infra", "must"]
story = "As a developer, I want end-to-end tests that run like production, so that base-path and mobile issues are caught in CI."
ac = [
  "Compose-based test stack: Caddy (same route as prod) + web + Postgres + MinIO",
  "Playwright projects: WebKit iPhone, Chromium Pixel, desktop Chromium",
  "Runs in CI on every PR; traces uploaded on failure",
  "Test prompts recorded in TEST.md",
]

[[story]]
epic = "hosting"
title = "Provision /opt/rowlens on trustable-prod (needs approval)"
labels = ["infra", "must", "decision-needed"]
story = "As an operator, I want an isolated place for RowLens on the server, so that it can be deployed without touching other apps."
ac = [
  "Exact commands shown and approved before running",
  "/opt/rowlens with .env (640), separate DOCKER_CONFIG, compose file from infra/compose/docker-compose.prod.yml",
  "New RowLens-only deploy key added to deploy's authorized_keys (approved)",
  "`docker compose -p rowlens up` runs web + db; nothing in the trustable project changes",
]
notes = "ADR-0002."

[[story]]
epic = "hosting"
title = "Caddy route /projects/rowlens in trustable.nl (needs approval)"
labels = ["infra", "must", "decision-needed"]
story = "As a user, I want RowLens reachable at https://trustable.nl/projects/rowlens."
ac = [
  "PR in the trustable.nl repo with the exact Caddyfile diff from ADR-0003, approved by Ewout",
  "Route placed before the default route; prefix not stripped; 64 MB request body limit; flush_interval -1",
  "AudioScribe and trustable.nl routes verified unchanged after reload",
]

[[story]]
epic = "hosting"
title = "CD: manually triggered deploy to production with health check and rollback"
labels = ["infra", "must"]
story = "As the product owner, I want to deploy a built image with one deliberate action, so that releases are safe and repeatable."
ac = [
  "On merge to main: build + push rowlens-web/worker images (immutable tags) to GHCR; no automatic deploy",
  "Deploy is a separate `workflow_dispatch` workflow taking an image tag, runnable only by the repo owner (no GitHub environments on the free private plan, ADR-0002)",
  "Steps: pull → DB backup → migrate → up -d → health check via the public URL",
  "Failed health check rolls back to the previous image tag automatically",
  "Only RowLens images are pruned",
]

[[story]]
epic = "hosting"
title = "Hello-world live at /projects/rowlens"
labels = ["infra", "must"]
story = "As the product owner, I want the skeleton live in production, so that base-path, TLS and deploy are proven before features."
ac = [
  "https://trustable.nl/projects/rowlens/ serves the skeleton; /health/live returns 200",
  "https://trustable.nl/projects/audioscribe/ and https://trustable.nl/ still healthy",
]

[[story]]
epic = "hosting"
title = "Prepare (disabled) staging deployment target"
labels = ["infra", "should"]
story = "As an operator, I want a staging target defined, so that we can switch it on when the staging server is ready."
ac = [
  "Deploy workflow accepts a `staging` target input; disabled until the staging server has room",
  "Deploy script parameterised by host and base URL",
]

[[story]]
epic = "auth"
title = "E-mail OTP login: request code, verify, session, logout"
labels = ["security", "must"]
story = "As a rower or coach, I want to log in with a code sent to my e-mail, so that I don't need a password."
ac = [
  "Request always returns the same response (no account enumeration)",
  "6-digit code, HMAC-stored, 10-minute TTL, single use, max 5 attempts",
  "Session cookie __Secure-rowlens_sid: HttpOnly, Secure, SameSite=Lax, Path=/projects/rowlens; 30-day sliding expiry",
  "Logout and 'log out other devices' revoke sessions",
  "Login flow translated NL/EN; Playwright test on mobile + desktop",
]
notes = "ADR-0011."

[[story]]
epic = "auth"
title = "Rate limiting and CSRF protection"
labels = ["security", "must"]
story = "As an operator, I want abuse limited, so that OTP and uploads can't be brute-forced or spammed."
ac = [
  "OTP limits: 3 codes / 15 min per e-mail, 10 / hour per IP, verify 10 / 15 min per IP; upload limits per user",
  "Double-submit CSRF token + Origin/Sec-Fetch-Site check on unsafe methods",
  "Tests for each limit and for cross-site requests being rejected",
]

[[story]]
epic = "auth"
title = "E-mail delivery: Resend SMTP, localised templates, sender domain"
labels = ["feature", "must", "i18n"]
story = "As a user, I want e-mails from RowLens to arrive and be in my language."
ac = [
  "Sender `RowLens <rowlens@trustable.nl>` via the existing Resend account (decided); SPF/DKIM/DMARC for trustable.nl verified in Resend",
  "HTML + text templates in NL/EN; all links absolute under the base path",
  "Dev mode logs codes when SMTP is unset; prod refuses to start without SMTP",
]

[[story]]
epic = "platform"
title = "Database: Drizzle migrations, owner/app roles, tenant transaction helper"
labels = ["security", "must"]
story = "As a developer, I want migrations and a tenant-scoped DB helper, so that every query runs with the right club context."
ac = [
  "Migrations run as rowlens_owner; app connects as rowlens_app (no BYPASSRLS)",
  "`withTenant(ctx, fn)` opens a transaction and SET LOCALs app.user_id / app.club_id",
  "Integration tests with Testcontainers Postgres",
  "Registers a `db` ReadinessCheck so `/health/ready` returns 503 when Postgres is unreachable",
]
notes = "ADR-0005."

[[story]]
epic = "platform"
title = "Media storage: BlobStore interface, MinIO on local disk, 30 GB cap"
labels = ["infra", "must"]
story = "As an operator, I want video storage that can never take the other apps on the server down."
ac = [
  "`BlobStore` interface (put/get range/presign/delete prefix) with an S3 implementation; MinIO in prod (data in /opt/rowlens/media), dev and CI",
  "Hard cap of 30 GB RowLens media (MEDIA_CAP_BYTES) checked against tus Upload-Length before accepting bytes; MinIO bucket quota as a backstop",
  "Per-upload cap of 4 GB; per-club quota defaults to the global cap",
  "Usage against the cap visible to coaches",
]
notes = "ADR-0006 (accepted): local disk for the pilot; Hetzner Object Storage is the preferred next step."

[[story]]
epic = "platform"
title = "Worker skeleton: Postgres job queue consumer"
labels = ["feature", "must"]
story = "As a developer, I want a worker that claims and runs jobs reliably, so that transcoding and analysis can run in the background."
ac = [
  "Claim with SKIP LOCKED, lease + heartbeat, retries with backoff, dead-letter status",
  "LISTEN/NOTIFY wake-up with polling fallback; resource classes cpu/gpu",
  "Idempotent handlers; structured logs with job id and request id",
]
notes = "ADR-0008."

[[story]]
epic = "platform"
title = "i18n framework NL/EN with checks for hard-coded strings"
labels = ["i18n", "must"]
story = "As a user, I want the app in Dutch or English, so that I can use it in my language."
ac = [
  "i18next catalogs nl/en; language from user preference, else browser, else nl",
  "ESLint rule blocks literal strings in UI code; CI fails on missing keys in either language",
  "Dates, numbers and durations formatted per locale",
]

[[story]]
epic = "platform"
title = "Observability: structured logs, error fingerprints, metrics"
labels = ["infra", "must"]
story = "As an operator, I want to see failures and throughput, so that I can fix problems before users report them."
ac = [
  "JSON logs (pino / structlog) with request id propagated web → job → worker; no personal data in logs",
  "No external error tracker (decided): errors logged with a stable fingerprint, counted as a metric, and new fingerprints listed in a daily health e-mail",
  "Internal metrics endpoint: uploads, processing time, job failures, queue depth",
]

[[story]]
epic = "platform"
title = "Disk and storage monitoring with alerts"
labels = ["infra", "must"]
story = "As an operator, I want an alert before the disk fills, so that the shared server stays up."
ac = [
  "RowLens-owned cron checks root disk and media storage usage",
  "E-mail alert at 75 % root disk or 80 % of the 30 GB media cap",
  "Uploads paused at 85 % root disk (whoever uses the space) with a clear message",
  "Usage exported as a metric",
]

[[story]]
epic = "platform"
title = "Database backups off-server with weekly restore test"
labels = ["infra", "must", "decision-needed"]
story = "As the product owner, I want backups I know I can restore, so that a server loss doesn't lose club data."
ac = [
  "Nightly encrypted pg_dump; 30 daily + 12 monthly retained",
  "Off-server destination chosen by Ewout (Storage Box or a small bucket) and copies verified",
  "Weekly automated restore into a throwaway container with sanity checks; failure alerts",
  "Restore runbook in docs/",
]
notes = "No video backup during the pilot (ADR-0006, decided 2026-11-01)."

